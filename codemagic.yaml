workflows:
  ios-release:
    name: iOS Release & TestFlight
    instance_type: mac_mini_m1
    environment:
      flutter: default
      vars:
        GEMINI_API_KEY: "AQ.Ab8RN6IY_hG6QpIjnjAxCAo-dAbIMS-egNT9cH_vpJgpujXxKA"
        OPENROUTER_API_KEY: "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"
        AZURE_SPEECH_KEY: "AnZ5l470hrJMMOqPYYH085lWbpFHjRH8nZCkryg0TWFF8yaVzDdOJQQJ99CGACPV0roXJ3w3AAAYACOGk7C0"
        AZURE_SPEECH_REGION: "germanywestcentral"
        REVENUECAT_APPLE_API_KEY: $REVENUECAT_APPLE_API_KEY
        REVENUECAT_GOOGLE_API_KEY: $REVENUECAT_GOOGLE_API_KEY
        YOUTUBE_API_KEY: "AIzaSyCvmm4uljoCyIFkBIoBybiishaWyyu2ROU"
        YOUTUBE_API_KEY_2: "AIzaSyBYEY2lbPnDPk179ztaw5MxLwu9keTqNlk"
        YOUTUBE_API_KEY_3: "AIzaSyAYEvgEEbjFXvTAMH7SvYsWMXbyIv0Ev_U"
    scripts:
      - name: Get dependencies
        script: flutter packages pub get
      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --export-method app-store \
            --dart-define="GEMINI_API_KEY=$GEMINI_API_KEY" \
            --dart-define="OPENROUTER_API_KEY=$OPENROUTER_API_KEY" \
            --dart-define="AZURE_SPEECH_KEY=$AZURE_SPEECH_KEY" \
            --dart-define="AZURE_SPEECH_REGION=$AZURE_SPEECH_REGION" \
            --dart-define="REVENUECAT_APPLE_API_KEY=$REVENUECAT_APPLE_API_KEY" \
            --dart-define="REVENUECAT_GOOGLE_API_KEY=$REVENUECAT_GOOGLE_API_KEY" \
            --dart-define="YOUTUBE_API_KEY=$YOUTUBE_API_KEY" \
            --dart-define="YOUTUBE_API_KEY_2=$YOUTUBE_API_KEY_2" \
            --dart-define="YOUTUBE_API_KEY_3=$YOUTUBE_API_KEY_3"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/debug-info/
