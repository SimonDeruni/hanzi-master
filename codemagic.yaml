workflows:
  ios-release:
    name: iOS Release & TestFlight
    instance_type: mac_mini_m1
    environment:
      flutter: default
      ruby: 3.2.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sinospark.app
      # API keys are stored as secret environment variables in the Codemagic dashboard.
      # Go to: App settings → Environment variables → add each key as a secret.
      vars:
        OPENROUTER_API_KEY: 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
        AZURE_SPEECH_KEY: AnZ5l470hrJMMOqPYYH085lWbpFHjRH8nZCkryg0TWFF8yaVzDdOJQQJ99CGACPV0roXJ3w3AAAYACOGk7C0
        AZURE_SPEECH_REGION: germanywestcentral
        REVENUECAT_APPLE_API_KEY: appl_AxHBAaTDjxdzKoJVcYXmiaHpQit
        REVENUECAT_GOOGLE_API_KEY: $REVENUECAT_GOOGLE_API_KEY
        YOUTUBE_API_KEY: AIzaSyCvmm4uljoCyIFkBIoBybiishaWyyu2ROU
        YOUTUBE_API_KEY_2: AIzaSyBYEY2lbPnDPk179ztaw5MxLwu9keTqNlk
        YOUTUBE_API_KEY_3: AIzaSyAYEvgEEbjFXvTAMH7SvYsWMXbyIv0Ev_U
    scripts:
      - name: Clean previous iOS build state
        script: |
          flutter clean
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*
      - name: Get dependencies
        script: flutter packages pub get
      - name: Install CocoaPods and verify iOS build phases
        script: |
          cd ios
          pod install
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          abort 'Runner target not found' unless runner

          phase_names = runner.build_phases.map do |phase|
            phase.respond_to?(:name) ? phase.name : nil
          end
          embed_index = phase_names.index('Embed App Extensions')
          thin_index = phase_names.index('Thin Binary')

          unless embed_index && thin_index && embed_index < thin_index
            abort 'Invalid Runner build phase order: Embed App Extensions must precede Thin Binary'
          end

          puts 'Verified: Embed App Extensions precedes Thin Binary'
          RUBY
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --export-method app-store \
            --dart-define="GEMINI_API_KEY=$GEMINI_API_KEY" \
            --dart-define="OPENROUTER_API_KEY=$OPENROUTER_API_KEY" \
            --dart-define="AZURE_SPEECH_KEY=$AZURE_SPEECH_KEY" \
            --dart-define="AZURE_SPEECH_REGION=$AZURE_SPEECH_REGION" \
            --dart-define="REVENUECAT_APPLE_API_KEY=$REVENUECAT_APPLE_API_KEY" \
            --dart-define="REVENUECAT_GOOGLE_API_KEY=$REVENUECAT_GOOGLE_API_KEY" \
            --dart-define="YOUTUBE_API_KEY=$YOUTUBE_API_KEY" \
            --dart-define="YOUTUBE_API_KEY_2=$YOUTUBE_API_KEY_2" \
            --dart-define="YOUTUBE_API_KEY_3=$YOUTUBE_API_KEY_3"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/debug-info/
