workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # We will store the Apple Developer API keys in a Codemagic variable group named "app_store_credentials"
      groups:
        - app_store_credentials
    
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
          
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          
      - name: Build iOS App
        script: |
          # This command builds the .ipa and uses Codemagic's automatic code signing
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        # Requires you to connect your Apple Developer account in Codemagic -> Teams -> Integrations
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers # Replace with your TestFlight group name if different
