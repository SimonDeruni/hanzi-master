name: hanzi_master
description: A mobile-first Chinese learning application.
publish_to: 'none'
version: 1.0.0+34

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Chinese Features
  flutter_tts: ^4.2.5
  audioplayers: ^6.1.1
  speech_to_text: ^7.3.0
  lpinyin: ^2.0.3
  path_drawing: ^1.0.1

  # Utils
  fpdart: ^1.1.0
  equatable: ^2.0.5
  intl: ^0.20.2
  uuid: ^4.5.2
  shared_preferences: ^2.5.4
  vector_math: ^2.1.4
  path_provider: ^2.1.2
  camera: ^0.11.0+5
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_object_detection: ^0.15.1
  google_mlkit_commons: ^0.11.1
  google_mlkit_digital_ink_recognition: ^0.14.2
  image_picker: ^1.2.1
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.0+3
  record: ^6.2.1
  permission_handler: ^12.0.3
  google_generative_ai: ^0.4.7
  web_socket_channel: ^3.0.3
  flutter_sound: ^9.30.0
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  url_launcher: ^6.3.2
  youtube_player_iframe: ^6.0.2
  webview_flutter: ^4.14.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0
  xml: ^6.6.1
  cached_network_image: ^3.4.1
  html: ^0.15.4
  cloud_firestore: ^6.6.0
  google_mlkit_translation: ^0.13.1
  purchases_flutter: ^10.4.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  home_widget: ^0.9.3
  purchases_ui_flutter: ^10.4.0
  pitch_detector_dart: ^0.0.7
  youtube_explode_dart: ^3.1.0
  googleai_dart: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.14.4"
  flutter_native_splash: ^2.4.0
  image: ^4.7.2
  change_app_package_name: ^1.5.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
    - assets/data/dictionary.db
    - assets/data/
    - assets/images/
    - assets/images/mandarin_bean/
    - assets/images/user_web_explorer.png
    - assets/images/ai_hub_web_explorer_zen1.png
    - assets/images/web_explorer_hero.png
    - assets/audio/
    - assets/default_stories.json
    - assets/mascot/
    - assets/mascot/data/

#  fonts:
#    - family: NotoSansSC
#      fonts:
#        - asset: assets/fonts/NotoSansSC-Regular.ttf
#        - asset: assets/fonts/NotoSansSC-Bold.ttf
#          weight: 700

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  background_color: "#FFC107"
  min_sdk_android: 21
  adaptive_icon_background: "#FFC107"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#FDFCF0"
  color_dark: "#1A1A1B"
  image: "assets/icon/icon.png"
  image_dark: "assets/icon/icon.png"
  android: true
  ios: true
  android_12:
    image: "assets/icon/icon.png"
    image_dark: "assets/icon/icon.png"
    color: "#FDFCF0"
    color_dark: "#1A1A1B"
